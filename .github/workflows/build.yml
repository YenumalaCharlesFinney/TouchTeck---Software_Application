name: Build Desktop App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm run electron:build

      - uses: actions/upload-artifact@v4
        with:
          name: touchteck-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error
